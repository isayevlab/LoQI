[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loqi"
version = "0.1.0"
description = "LoQI: scalable low-energy molecular conformer generation with quantum mechanical accuracy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md", "megalodon_licence/*.txt"]
authors = [{ name = "Filipp Nikitin" }]
keywords = ["conformer generation", "diffusion model", "cheminformatics", "rdkit", "pytorch geometric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "torch>=2.8",
    "torch_geometric>=2.6",
    "rdkit>=2025.3",
    "lightning>=2.4",
    "omegaconf>=2.3",
    "einops>=0.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["hydra-core>=1.3", "wandb", "zarr>=2.18,<3", "numcodecs", "h5py", "pandas"]
aimnet = ["aimnet>=0.2"]
dev = ["pytest", "ruff"]

[project.scripts]
loqi = "loqi.cli:main"

[project.urls]
Homepage = "https://github.com/isayevlab/LoQI"
Repository = "https://github.com/isayevlab/LoQI"
Checkpoints = "https://doi.org/10.1184/R1/31441570"

[tool.hatch.build.targets.wheel]
packages = ["src/megalodon", "src/loqi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: end-to-end tests that load the LoQI checkpoint"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "src/megalodon/data",
    "src/megalodon/dynamics",
    "src/megalodon/inference",
    "src/megalodon/interpolant",
    "src/megalodon/metrics",
    "src/megalodon/models",
    "scripts/sample.py",
    "scripts/train.py",
    "scripts/performance_test.py",
    "scripts/loqi_inference_shim.py",
    "data_processing",
    "app",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
