name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment
        run: |
          uv venv --clear --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install CPU torch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -m "not slow"

  slow:
    # End-to-end sampling with the released checkpoint; weekly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Create virtual environment
        run: |
          uv venv --clear --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install CPU torch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: uv pip install -e ".[dev]"
      - name: Cache checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/loqi
          # sha256 of loqi.ckpt from loqi.registry.MODELS; bump when the registry entry changes.
          key: loqi-ckpt-5ebf59836216a4249f5d856c6f3c750d86f9651acfb8745640f13ffaaeb0c007
      - name: Download checkpoint (verified, skipped when cached)
        run: loqi download --model loqi
      - name: Slow tests
        run: pytest -m slow -s
