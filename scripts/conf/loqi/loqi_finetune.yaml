run_name: 'loqi_csd_dimer_ft_20k'
# outdir: /data/jarret/loqi/csd_train_outputs/csd_mono_finetune/debug
outdir: /data/jarret/loqi/csd_train_outputs/csd_dimer_ft_20k
# resume: /home/jarret/LoQI/data/loqi.ckpt
resume: /data/jarret/loqi/csd_train_outputs/csd_mono_finetune_FIXED-PREPROCESS_FIXED-VAL/loqi_csd_mono_ft_FIXED-PREPROCESS_FIXED-VAL/checkpoints/best-epoch=345-step=1828438--opt_median_relative_energy=-1.960.ckpt
ema: True
wandb_params:
  mode: 'online'  # disabled, offline, online
  group: 'conformers'
  project: 'loqi_csd_finetune'

data:
  dataset_root: "/data/jarret/loqi/csd_loqi_data/dimers/csd_loqi_dimers_20k__dih-relax"
  processed_folder: "processed"
  batch_size: &batch_size 32
  inference_batch_size: 32
  removed_h: False
  data_loader_type: "adaptive"
  aug_rotations: True
  scale_coords: &scale_coords 1.0

loss:
  variables:
    - variable_name: 'x'
      loss_scale: 3.0
      aggregate: 'mean'
      continuous: True
      use_distance: null
      distance_scale: null

interpolant:
  timesteps: &timesteps 25
  time_type: &time_type "discrete" #["discrete, "continuous]
  scheduler_type: &scheduler_type "cosine_adaptive" #["cosine_adaptive, "linear"]
  sample_time_method: "uniform" # ["symmetric", "uniform", "stab_mode", "logit_normal", "beta"]
  sample_time_mean: 0 # Used in stab_mode and logit_normal
  sample_time_scale: 0.81 # Used in stab_mode and logit_normal
  global_variable_name: 'x' # variable that is specficed below to be used for sampling time and loss sampling
  min_t: &min_t 0
  variables:
    - variable_name: 'x'
      interpolant_type: 'continuous_diffusion' #["continuous_diffusion", "continuous_flow_matching"]
      diffusion_type: 'vdm'
      prior_type: 'gaussian'
      timesteps: *timesteps
      num_classes: 3
      scheduler_type: *scheduler_type
      scheduler_cut: False
      time_type: *time_type
      nu: 2.5
      com_free: True
      min_t: *min_t
    - variable_name: 'h'
      interpolant_type: "discrete_null" #["discrete_diffusion", "discrete_flow_matching"]
      num_classes: &num_atoms 17
      prior_type: null
    - variable_name: 'edge_attr'
      interpolant_type: "discrete_null" #["discrete_diffusion", "discrete_flow_matching"]
      num_classes: 9
      prior_type: null
    - variable_name: 'charges'
      interpolant_type: "discrete_null" #["discrete_diffusion", "discrete_flow_matching"]
      concat: 'h'
      num_classes: 6
      offset: 2
      prior_type: null

dynamics:
  model_name: "megav3conf"
  model_args:
    atom_classes: 23
    edge_classes: 9
    invariant_edge_feat_dim: 64
    invariant_node_feat_dim: 256
    n_vector_features: 64
    equivariant_node_feature_dim: 3
    num_layers: 10
    num_heads: 4
    dist_size: 16
    prune_edges: False
  wrapper_args:
    timesteps: *timesteps
    time_type: *time_type

self_conditioning:
  name: "base"
  variables:
    - variable_name: x
      hidden_dims: 32
      fuse_softmax: False
      vector: True
      clamp_min: -100
      clamp_max: 100

sample:
  node_distribution: "${data.dataset_root}/processed/train_n_h.pickle" # null

train:
  seed: 42
  gpus: 1
  n_epochs: 500
  enable_progress_bar: True
  gradient_clip_value: 1.0
  log_freq: 10
  val_freq: 2
  checkpoint_monitor: opt_median_relative_energy
  checkpoint_monitor_mode: min
  checkpoint_every_n_train_steps: 100

evaluation:
  type: conformers
  max_molecules: 300
  timesteps: *timesteps
  compute_3D_metrics: True
  compute_energy_metrics: True
  compute_stereo_metrics: True
  scale_coords: *scale_coords
  energy_metrics_args:
    model_path: src/megalodon/metrics/aimnet2/cpcm_model/wb97m_cpcms_v2_0.jpt
    batchsize: 32
    opt_metrics: True
    opt_params:
      fmax: 2e-3
      max_nstep: 3000

optimizer:
  type: adamw
  lr: 1.e-5
  weight_decay: 1.e-12
  amsgrad: True

lr_scheduler:
  type: linear_warmup
  initial_lr: 1.e-6
  final_lr: 1.e-5
  num_warmup_steps: 100
  interval: step
  frequency: 1 #not in config but this is the default
